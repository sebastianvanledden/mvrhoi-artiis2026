# MVRHOI fine-tuning hyperparameters (RTX 3060 friendly)

# General
random_seed: 1551
img_size: 640
yolov5_stride: 32
train_ratio: 1.0

# Sampling / dataset
sampling_mode: "window"  # supported: clip, window, anticipation
future_num: 0
future_type: "all"
future_ratio: 0.5
min_clip_length: 1
max_clip_length: 10
sttran_sliding_window: 6
max_human_num: 12
max_interaction_pairs: 1800
max_interaction_pairs_per_frame: 16
subset_val_len: -1

# Augmentations
color_jitter: false
hflip_p: 0.5
mlp_projection: false
sinusoidal_encoding: true
separate_head: true
split_window: "pair"

# Transformer / model
dim_gaze_heatmap: 64
dim_transformer_ffn: 2048 
sttran_enc_layer_num: 1
sttran_dec_layer_num: 3
dropout: 0.1
clip_norm_max: 1.0  # Increased from 0.01 for better gradient flow
clip_norm_type: 2

# Optimisation
batch_size: 2
batch_size_val: 2
init_lr: 1.0e-7
peak_lr: 1.0e-4  # Increased for better domain adaptation
final_lr: 1.0e-6
final_lr_scale: 0.1
backbone_lr_mult: 1.0  # When --finetune-backbone is enabled, scales LR for trainable backbone layers
decay_steps: 25  # More steps to adapt
weight_decay: 1.0e-2
loss_type: "focal"
loss_balance_type: "effective"
loss_balance_power: 1.0
loss_balance_beta: 0.9999
loss_focal_gamma: 0.5

# Early stopping / evaluation
early_metric: "map"
early_patience: 10  # More patience for domain adaptation
early_min_epoch: 15  # Let it train longer before early stopping
early_min_improvement: 1.0e-8
interaction_conf_threshold: [0.1, 0.3, 0.5]  # Multiple thresholds for evaluation
eval_k: [10, 20, 50]
rare_limit: 25
iou_threshold: 0.5

# Runtime helpers (optional / not all are consumed)
gradient_accumulation_steps: 4  # With batch_size=2 gives effective batch ~8
mixed_precision: true
num_workers: 2
pin_memory: true